<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">PIERRICK.OS — Creative Engineering Lab</title>
  <desc id="desc">A bright, modern AI-inspired desktop with nostalgic pixel UI. Windows display Pierrick's coding lab and current projects.</desc>
  <defs>
